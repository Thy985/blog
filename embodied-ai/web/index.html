<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M10 24V13l5-5M22 24v-8l-5-4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='24' r='2.4' fill='white'/%3E%3Ccircle cx='22' cy='24' r='2.4' fill='white'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="从身体的自由度讲到大脑的插槽——一份有立场的具身智能学习笔记。70% 知识 + 30% 项目。"
    />
    <meta name="color-scheme" content="light dark" />
    <title>用一台双臂机器人打开具身智能的大门</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ea-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
